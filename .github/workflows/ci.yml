name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a breaking change in Suricata turns the build red before it
    # reaches anyone's sensor rather than after.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

      - name: Scan the bundled sample end to end
        run: |
          go build -o tarsier-scan ./cmd/tarsier-scan
          ./tarsier-scan testdata/demo-week.json > out.txt
          ./tarsier-scan -html survey.html testdata/demo-week.json
          # Guard the two headline claims: devices are found, and problems are
          # reported. A silent regression here would look like success.
          grep -q "18 devices found" out.txt
          grep -q "THINGS WORTH LOOKING AT" out.txt
          test -s survey.html
          # The report must stay self-contained: no external fetches, ever.
          ! grep -Eq '(src|href)="https?://[^"]*\.(js|css|png|woff2?)' survey.html

      - name: Machine-readable outputs and change detection
        run: |
          set -e
          go build -o tarsier-diff ./cmd/tarsier-diff

          # The JSON snapshot is what every downstream consumer depends on, and
          # the diff is what makes this a weekly habit rather than a one-off.
          ./tarsier-scan -json before.json -until 2026-07-26 testdata/demo-week.json
          ./tarsier-scan -json after.json testdata/demo-week.json
          python3 -c "import json;d=json.load(open('after.json'));assert d['schema']==1;assert len(d['devices'])==18"

          # A device must resolve a vendor from the IEEE registry. If the OUI
          # data file were ever truncated or unembedded this stays silent
          # otherwise, and identification quietly collapses to what it was
          # before the registry was added.
          python3 -c "
          import json,sys
          d=json.load(open('after.json'))
          named=[x for x in d['devices'] if x.get('vendor')]
          print(len(named),'of',len(d['devices']),'devices have a vendor')
          sys.exit(0 if len(named)>=12 else 1)"

          # Exit status 1 means 'something changed', which is the contract cron
          # depends on. Anything else is a bug.
          ./tarsier-diff before.json after.json && { echo 'diff reported no change'; exit 1; }
          ./tarsier-diff after.json after.json  || { echo 'identical snapshots differed'; exit 1; }

          # The NetBox CSV has to stay importable.
          ./tarsier-scan -netbox netbox.csv testdata/demo-week.json
          python3 -c "
          import csv
          rows=list(csv.reader(open('netbox.csv')))
          assert rows[0]==['address','status','dns_name','description','comments'], rows[0]
          assert len(rows)==19, len(rows)
          assert all('/' in r[0] for r in rows[1:])"

      - name: Segmentation policy
        run: |
          set -e
          # A policy that permits what is actually there must stay silent, and
          # one that forbids it must not. Both directions matter: a check that
          # fires on everything is as useless as one that never fires.
          cat > strict.conf <<'EOF'
          zone office  10.0.1.0/24
          zone cameras 10.0.7.0/24
          zone servers 10.0.0.0/24
          allow office -> servers
          EOF
          ./tarsier-scan -zones strict.conf -json strict.json testdata/demo-week.json
          python3 -c "
          import json
          f=[x for x in json.load(open('strict.json'))['findings'] if 'segmentation' in x['kind']]
          assert f, 'a forbidden crossing went unreported'
          assert any(x['device']=='10.0.1.21' for x in f), f
          print(len(f),'segmentation findings')"

          cat > permissive.conf <<'EOF'
          zone office 10.0.1.0/24
          zone rest   10.0.0.0/24 10.0.4.0/24 10.0.7.0/24 10.0.9.0/24
          allow office <-> rest
          EOF
          ./tarsier-scan -zones permissive.conf -json permissive.json testdata/demo-week.json
          python3 -c "
          import json
          f=[x for x in json.load(open('permissive.json'))['findings'] if 'segmentation' in x['kind']]
          assert not f, f'permitted traffic was reported anyway: {f}'
          print('permitted traffic stays silent')"

          # A typo in a zone name has to be fatal. A policy that fails open
          # reports a clean network for the one question the operator cared about.
          printf 'zone a 10.0.0.0/24\nallow a -> tyop\n' > broken.conf
          ./tarsier-scan -zones broken.conf testdata/demo-week.json && \
            { echo 'a broken policy was accepted'; exit 1; }
          echo "broken policy refused"

      - name: Follow a live log across a rotation
        run: |
          set -e
          go build -o tarsier-watch ./cmd/tarsier-watch
          mkdir -p live

          # Everything except one device, so there is a genuinely new arrival
          # later rather than only a change to something already known.
          grep -v '10.0.20.9' testdata/demo-week.json | head -300 > live/eve.json

          ./tarsier-watch -json live/inv.json -every 1s -poll 500ms \
            -notify 3s -changes live/changes.jsonl \
            -on-change 'cat >> live/hook.txt' live/eve.json > live/out.log 2>&1 &
          watch_pid=$!
          sleep 2

          # Written before the rename and therefore present only in the rotated
          # file. A follower watching the path rather than its own handle drops
          # exactly these lines, and the device count below is what catches it.
          grep '10.0.20.9' testdata/demo-week.json | head -40 >> live/eve.json
          mv live/eve.json live/eve.json.1
          sed -n '301,600p' testdata/demo-week.json > live/eve.json
          sleep 6

          kill "$watch_pid" 2>/dev/null || true
          sleep 1
          cat live/out.log

          # The new device has to have survived the rotation.
          python3 -c "
          import json
          d=json.load(open('live/inv.json'))
          ips={x['ip'] for x in d['devices']}
          assert '10.0.20.9' in ips, 'device written just before rotation was lost'
          print(len(ips),'devices after rotation')"

          # It has to have said so, too. Reports accumulate rather than
          # overwrite: more than one interval can elapse here, and a later
          # quieter report must not erase the one that named the new device.
          test -s live/hook.txt || { echo 'no change report was delivered'; exit 1; }
          grep -q '10.0.20.9' live/hook.txt || {
            echo 'no report mentioned the device that appeared'; cat live/hook.txt; exit 1; }

          # Every list present even when empty, so jq does not error on a quiet
          # night. This is the contract anything tailing the file depends on.
          python3 -c "
          import json
          for line in open('live/changes.jsonl'):
              d=json.loads(line)
              for k in ('appeared','disappeared','changed','new_findings','fixed_findings'):
                  assert isinstance(d[k], list), (k, d[k])
          print('change log is well formed')"

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build every release target
        run: |
          set -e
          # freebsd/amd64 is not optional: OPNsense and pfSense are where most
          # of the world's dormant Suricata installs actually live.
          for t in linux/amd64 linux/arm64 linux/arm freebsd/amd64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/tarsier-scan
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/tarsier-diff
            # tarsier-watch is the one with per-platform source: opening the log
            # so that rotation still works, and running the -on-change hook, are
            # done differently on Windows. That is exactly the code a
            # single-platform build would never exercise.
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -o /dev/null ./cmd/tarsier-watch
            echo "ok  $t"
          done

  suricata:
    name: Suricata ${{ matrix.suricata }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # distro = whatever Ubuntu ships (older, what many people actually run).
        # oisf   = current stable, which is what the sensor image installs.
        suricata: [distro, oisf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Suricata
        run: |
          set -e
          if [ "${{ matrix.suricata }}" = "oisf" ]; then
            sudo add-apt-repository -y ppa:oisf/suricata-stable
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq suricata
          # The package starts Suricata as a service. Our own instance would
          # then abort on the existing pidfile, so stop it and clear the file.
          sudo systemctl stop suricata || true
          sudo systemctl disable suricata || true
          sudo pkill -TERM suricata || true
          sleep 3
          sudo rm -f /var/run/suricata.pid
          suricata -V

      - name: Our config must load on this version
        run: |
          set -e
          mkdir -p run/log && cd run
          cp ../deploy/sensor/suricata.yaml .
          # Trim memcaps for a CI runner and point logs at the workspace.
          sed -i 's/^  memcap: 256mb/  memcap: 48mb/;s/^    memcap: 512mb/    memcap: 64mb/' suricata.yaml
          sed -i "s#default-log-dir: /var/log/suricata#default-log-dir: $PWD/log#" suricata.yaml
          sed -i "s#^default-rule-path.*#default-rule-path: $PWD#" suricata.yaml
          sed -i 's#^  - suricata.rules#  - empty.rules#' suricata.yaml
          touch empty.rules
          # An older Suricata may not know every section we enable; that is
          # expected and is why the sensor image ships a current version. What
          # must not happen is Tarsier failing to read whatever it does produce.
          sudo suricata -T -c suricata.yaml \
            --set classification-file=/etc/suricata/classification.config \
            --set reference-config-file=/etc/suricata/reference.config \
            || echo "::warning::config not fully supported on ${{ matrix.suricata }} Suricata"

      - name: Produce real EVE and parse it
        run: |
          set -e
          cd run
          IFACE=$(ip -o -4 route show default | awk '{print $5}' | head -1)
          echo "capturing on $IFACE"
          # Own pidfile, so a stray service instance cannot collide with ours.
          sudo suricata -c suricata.yaml --af-packet=$IFACE \
            --pidfile "$PWD/suricata.pid" \
            --set classification-file=/etc/suricata/classification.config \
            --set reference-config-file=/etc/suricata/reference.config -D
          sleep 10
          for h in github.com debian.org cloudflare.com wikipedia.org; do
            dig +short $h >/dev/null 2>&1 || true
            curl -s -o /dev/null --max-time 5 "https://$h" || true
          done
          sleep 10
          sudo pkill -TERM suricata || true
          sleep 5
          sudo chmod -R a+r log
          test -s log/eve.json
          echo "event types produced:"
          grep -o '"event_type":"[a-z0-9_-]*"' log/eve.json | sort | uniq -c
          cd ..
          go build -o tarsier-scan ./cmd/tarsier-scan
          # The real assertion: whatever this Suricata emitted, we read it
          # without failing. Tolerance is the promise, so tolerance is the test.
          ./tarsier-scan run/log/eve.json
