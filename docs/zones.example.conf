# Segmentation policy — describe the network you meant to build, and Tarsier
# reports where the traffic disagrees with you.
#
#   tarsier-scan  -zones zones.conf /var/log/suricata/
#   tarsier-watch -zones zones.conf -html survey.html /var/log/suricata/eve.json
#
# Copy this file, replace the ranges with yours, delete what does not apply.
# Everything here is an example and none of it is a default.

# ---------------------------------------------------------------------------
# Zones: the segments you believe you have.
#
# Declared by CIDR. The most specific match wins, so you can carve a management
# range out of a wider one without describing the larger zone as a list of holes
# — 10.0.1.240/28 below sits inside the office range and takes precedence.
# ---------------------------------------------------------------------------

zone office    10.0.1.0/24 10.0.2.0/24
zone mgmt      10.0.1.240/28
zone servers   10.0.0.0/24
zone cameras   10.0.7.0/24
zone card      10.0.5.0/24
zone ot        10.0.20.0/24
zone guest     10.0.50.0/24

# ---------------------------------------------------------------------------
# Allowed directions. Anything else between two declared zones is reported.
#
# Traffic inside a zone is always fine. Traffic involving an address you never
# declared raises nothing at all — we do not know where you meant it to live,
# and guessing would bury the real findings.
#
# -> is one direction. <-> is both.
# ---------------------------------------------------------------------------

allow office  -> servers
allow office  -> cameras     # if the security desk is on the office network
allow mgmt   <-> servers
allow mgmt    -> ot          # engineering workstations reaching the plant

# Nothing allows card, ot or guest to reach office or each other. That is the
# point of writing this down: those crossings are what you want to hear about.
#
# When a crossing turns out to be legitimate, add the allow rather than
# ignoring the finding — a policy nobody trusts gets switched off, and then it
# was never worth writing.
