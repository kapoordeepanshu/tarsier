<!-- GitHub social preview: 1280x640, the size GitHub renders in link cards on
     LinkedIn, Slack, X and Discord. Upload via Settings → General → Social
     preview, which replaces GitHub's auto-generated card of repo statistics. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640"
     font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<title>Tarsier — passive network asset intelligence from Suricata</title>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1424"/><stop offset="1" stop-color="#060B14"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5B8DFF"/><stop offset="1" stop-color="#5B8DFF" stop-opacity=".25"/>
  </linearGradient>
</defs>

<rect width="1280" height="640" fill="url(#bg)"/>
<!-- Faint survey grid, the same texture the report uses. -->
<g stroke="#5B8DFF" stroke-width="1" opacity=".05">
  <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280M0 360H1280M0 420H1280M0 480H1280M0 540H1280M0 600H1280"/>
  <path d="M60 0V640M120 0V640M180 0V640M240 0V640M300 0V640M360 0V640M420 0V640M480 0V640M540 0V640M600 0V640M660 0V640M720 0V640M780 0V640M840 0V640M900 0V640M960 0V640M1020 0V640M1080 0V640M1140 0V640M1200 0V640M1260 0V640"/>
</g>

<!-- wordmark -->
<g transform="translate(78,86)">
  <g stroke="#5B8DFF" stroke-width="2.6" fill="none" transform="scale(1.75)">
    <circle cx="8" cy="11" r="5.4"/><circle cx="19" cy="11" r="5.4"/>
    <circle cx="9.9" cy="11" r="1.9" fill="#5B8DFF" stroke="none"/>
    <circle cx="17.1" cy="11" r="1.9" fill="#5B8DFF" stroke="none"/>
  </g>
  <text x="66" y="34" font-size="40" font-weight="650" fill="#EAF0F8" letter-spacing="-1">Tar<tspan fill="#5B8DFF">sier</tspan></text>
</g>

<!-- the claim -->
<text x="78" y="228" font-size="52" font-weight="650" fill="#EAF0F8" letter-spacing="-1.6">Your IDS already knows everything</text>
<text x="78" y="292" font-size="52" font-weight="650" fill="#EAF0F8" letter-spacing="-1.6">on your network. It just never</text>
<text x="78" y="356" font-size="52" font-weight="650" fill="#5B8DFF" letter-spacing="-1.6">told you.</text>

<text x="78" y="416" font-size="23" fill="#94A6C0">Passive asset discovery from the 95% of Suricata's</text>
<text x="78" y="450" font-size="23" fill="#94A6C0">eve.json that every other tool throws away.</text>

<!-- what it is not: the constraints are the product -->
<g transform="translate(78,500)" font-size="18" font-weight="500">
  <rect width="150" height="40" rx="20" fill="#12203A"/>
  <text x="75" y="26" fill="#8FB4FF" text-anchor="middle">No agents</text>
  <rect x="164" width="164" height="40" rx="20" fill="#12203A"/>
  <text x="246" y="26" fill="#8FB4FF" text-anchor="middle">No scanning</text>
  <rect x="342" width="196" height="40" rx="20" fill="#12203A"/>
  <text x="440" y="26" fill="#8FB4FF" text-anchor="middle">No credentials</text>
  <rect x="552" width="238" height="40" rx="20" fill="#12203A"/>
  <text x="671" y="26" fill="#8FB4FF" text-anchor="middle">Never in the path</text>
</g>

<text x="78" y="592" font-size="19" fill="#5D708F">Free and open source · github.com/kapoordeepanshu/tarsier</text>

<!-- A device list fading in from the right: the thing the tool produces. -->
<g transform="translate(880,150)" opacity=".9">
  <rect width="330" height="340" rx="16" fill="#111827" opacity=".85"/>
  <text x="24" y="38" font-size="15" font-weight="600" fill="#8FA3BE">214 devices found</text>
  <line x1="24" y1="54" x2="306" y2="54" stroke="#22304A"/>
  <g font-size="14">
    <circle cx="36" cy="84" r="11" fill="none" stroke="#22304A" stroke-width="2"/>
    <path d="M36 73a11 11 0 1 1-6 20.3" fill="none" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="82" fill="#EAF0F8">ACCTS-PC-04</text>
    <text x="60" y="98" font-size="12" fill="#FB923C">Windows 7 · end of life</text>

    <circle cx="36" cy="140" r="11" fill="none" stroke="#22304A" stroke-width="2"/>
    <path d="M36 129a11 11 0 1 1-1 22" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="138" fill="#EAF0F8">BRN3A1C44</text>
    <text x="60" y="154" font-size="12" fill="#61738F">Brother · printer</text>

    <circle cx="36" cy="196" r="11" fill="none" stroke="#22304A" stroke-width="2"/>
    <path d="M36 185a11 11 0 1 1-2.2 21.8" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="194" fill="#EAF0F8">IPCAM-LOBBY</text>
    <text x="60" y="210" font-size="12" fill="#FB7185">talking to 3 countries</text>

    <circle cx="36" cy="252" r="11" fill="none" stroke="#22304A" stroke-width="2"/>
    <path d="M36 241a11 11 0 1 1-.4 22" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="250" fill="#EAF0F8">PLC-LINE-2</text>
    <text x="60" y="266" font-size="12" fill="#61738F">Modbus · industrial</text>

    <circle cx="36" cy="308" r="11" fill="none" stroke="#22304A" stroke-width="2"/>
    <path d="M36 297a11 11 0 0 1 7.5 2.9" fill="none" stroke="#61738F" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="306" fill="#8FA3BE">10.0.9.203</text>
    <text x="60" y="322" font-size="12" fill="#61738F">unidentified</text>
  </g>
  <g fill="url(#bar)" opacity=".5" transform="translate(24,352)">
    <rect x="0" y="14" width="9" height="8" rx="2"/><rect x="13" y="6" width="9" height="16" rx="2"/>
    <rect x="26" y="0" width="9" height="22" rx="2"/><rect x="39" y="9" width="9" height="13" rx="2"/>
    <rect x="52" y="16" width="9" height="6" rx="2"/><rect x="65" y="4" width="9" height="18" rx="2"/>
    <rect x="78" y="2" width="9" height="20" rx="2"/><rect x="91" y="12" width="9" height="10" rx="2"/>
  </g>
</g>
</svg>
